name: NAS images
on:
  push:
    branches: [nas]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: nas-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm ci --prefix spider
      - run: npm test --prefix spider
  publish:
    needs: verify
    strategy:
      matrix:
        arch: [amd64, arm64]
        image: [libretv, libretv-spider]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'libretv' && '.' || './spider' }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:nas-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
  manifest:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [libretv, libretv-spider]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE}"
          docker buildx imagetools create -t "$image:nas" -t "$image:nas-$GITHUB_SHA" \
            "$image:nas-$GITHUB_SHA-amd64" "$image:nas-$GITHUB_SHA-arm64"
